name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser
        # Session 6's browser-fallback tests launch a real headless
        # Chromium instance against local fixture HTTP servers (never live
        # internet targets). `--with-deps` also installs the OS-level
        # shared libraries Chromium needs on the runner image.
        run: pnpm --filter @panchnama/audit-cli exec playwright install --with-deps chromium

      - name: Build workspace packages
        # packages/* publish their types and runtime entry from dist/
        # (package.json "types"/"exports"), so lint/typecheck/test cannot
        # resolve cross-package imports on a fresh checkout until these build.
        run: pnpm -r --workspace-concurrency=1 --filter "./packages/*" run build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium browser (apps/web)
        run: pnpm --filter @panchnama/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: E2E tests (apps/web)
        run: pnpm --filter @panchnama/web run test:e2e
        env:
          CI: true
